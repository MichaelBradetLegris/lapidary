name: Bug report
description: Something in the app does not work as it should.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this. Issues are public, so please do not paste chapter text, API keys, email addresses, file paths that show your Windows user name, or folder names you would rather not show.

        To report a security problem, do not open an issue: see SECURITY.md in the repository.
  - type: input
    id: version
    attributes:
      label: App version
      description: |
        Open Settings, then About: the version is under the app's name. If the app does not start, press Windows+R, paste `%APPDATA%\ai-grammar-checker\logs\main.log`, press Enter, and find the last line that contains `app.start version=`. If you cloned the repository with Git, the commit (`git rev-parse --short HEAD` in its folder) helps too.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - Installer
        - Development run (npm run dev or dev:clean)
    validations:
      required: false
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: In Windows, open Settings > System > About and copy the edition and version under "Windows specifications".
      placeholder: Windows 11 Home, 24H2
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      description: Which service was reviewing when it happened.
      options:
        - Claude
        - OpenAI (API key)
        - Not related to a review
    validations:
      required: true
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      description: For Claude problems only. Run `claude --version` in PowerShell.
      placeholder: 2.1.266
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Copy any message the app showed.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics or log
      description: |
        Press Copy diagnostics, near the foot of the Setup screen (Settings, then Setup in the Claude account row) or under Diagnostics in About (Settings, then About), and paste the text here. It gives the versions, your settings and what the last checks found. If a maintainer asks for the log as well, press Windows+R, paste `%APPDATA%\ai-grammar-checker\logs\main.log` and press Enter, and copy the lines from around the time it happened. The app leaves chapter text, keys and email addresses out of both and shortens your user folder to `~`, but Copy diagnostics gives the paths of your manuscript folder, reviews folder and guidelines file, so read the text before you paste it.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I removed manuscript text, API keys, email addresses, my Windows user name and any folder names I would rather not show from everything above.
          required: true
